<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Tour</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#1d2b3a;color:#222}
#wrap{max-width:1107px;margin:0 auto}
#stage{position:relative;width:100%;aspect-ratio:1107/654;overflow:hidden;background:#fff}
#stage img{width:100%;height:100%;display:block}
.dot{position:absolute;width:calc(var(--u)*30px);height:calc(var(--u)*30px);min-width:22px;min-height:22px;margin:calc(var(--u)*-15px) 0 0 calc(var(--u)*-15px);border-radius:50%;border:0;background:#ffe600;color:#111;font-weight:700;font-size:calc(var(--u)*22px);line-height:1;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(255,230,0,.7);animation:pulse 1.8s infinite}
.dot:hover,.dot:focus-visible{transform:scale(1.18);outline:3px solid #fff}
.dot.done{background:#2e9e5b;color:#fff;animation:none}
.dot .tip{position:absolute;bottom:125%;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:calc(var(--u)*13px);font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.dot:hover .tip,.dot:focus-visible .tip{opacity:1}
@keyframes pulse{70%{box-shadow:0 0 0 calc(var(--u)*16px) rgba(255,230,0,0)}100%{box-shadow:0 0 0 0 rgba(255,230,0,0)}}
#spot{position:absolute;z-index:6;border-radius:6px;box-shadow:0 0 0 9999px rgba(10,20,35,.62);outline:3px solid #ffe600;opacity:0;pointer-events:none;transition:opacity .25s}
#spot.on{opacity:1;pointer-events:auto}
#card{position:absolute;z-index:8;width:38%;background:#fff;border-radius:10px;padding:calc(var(--u)*22px);box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;font-size:calc(var(--u)*17px)}
#card.on{display:block;animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#card h2{margin:0 0 .5em;font-size:1.45em;font-weight:500;color:#1d3b66}
#card p{margin:.5em 0;line-height:1.45}
#card .try{background:#fff9c4;border-left:4px solid #ffe600;padding:.55em .8em;border-radius:4px;margin-top:.8em}
.btns{display:flex;justify-content:center;gap:12px;margin-top:1em}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:.55em 1.4em;cursor:pointer;background:#ffe600;color:#111}
.btn.sec{background:#e6e9ee}
.btn:hover{filter:brightness(.93)}
#bar{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#16222f;color:#fff;flex-wrap:wrap}
#prog{flex:1;min-width:180px}
#track{height:10px;background:#34465a;border-radius:6px;overflow:hidden;margin-top:5px}
#fill{height:100%;width:0;background:#2e9e5b;transition:width .3s}
#msg{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:9;background:#2e9e5b;color:#fff;padding:10px 22px;border-radius:30px;font-weight:700;display:none;font-size:calc(var(--u)*18px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
#msg.bad{background:#c0392b}
#q{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:9;width:70%;background:#fff;border-radius:10px;padding:calc(var(--u)*14px) calc(var(--u)*20px);box-shadow:0 8px 30px rgba(0,0,0,.45);display:none;font-size:calc(var(--u)*18px);text-align:center}
#q small{display:block;color:#667;font-weight:600;margin-bottom:4px}
.hit{position:absolute;z-index:7;cursor:pointer;display:none;border-radius:6px}
.hit.hint{display:block;outline:3px dashed #ffe600;animation:pulse 1s infinite}
.quiz .dot{display:none}
.quiz .hit{display:block}
.quiz .hit:hover{background:rgba(255,230,0,.2)}
</style></head><body>

var SPOTS=[

});
function place(el,s,pad){el.style.left=pc(s.rect[0]-pad,W);el.style.top=pc(s.rect[1]-pad,H);el.style.width=pc(s.rect[2]+pad*2,W);el.style.height=pc(s.rect[3]+pad*2,H)}
function openSpot(i){
 current=i;var s=SPOTS[i];place(spot,s,4);spot.classList.add('on');

 card.style.left=s.cardX==='left'?'4%':'58%';card.style.top=s.cardY+'%';card.classList.add('on');

 document.getElementById('cNext').onclick=function(){closeCard();if(i<SPOTS.length-1){openSpot(i+1)}};

}

 document.getElementById('quizBtn').textContent='Exit quiz';ask()}
function stopQuiz(){quiz=false;stage.classList.remove('quiz');qbox.style.display='none';document.querySelectorAll('.hit').forEach(function(h){h.classList.remove('hint')});document.getElementById('quizBtn').textContent='Test yourself'}
function ask(){document.querySelectorAll('.hit').forEach(function(h){h.classList.remove('hint')});misses=0;
 if(qi>=qOrder.length){qbox.innerHTML='<small>Quiz complete</small><b>You scored '+score+' out of '+qOrder.length+'.</b><div class="btns"><button class="btn sec" id="qa">Try again</button><button class="btn" id="qx">Back to tour</button></div>';
  document.getElementById('qa').onclick=startQuiz;document.getElementById('qx').onclick=stopQuiz;return}
 qbox.innerHTML='<small>Question '+(qi+1)+' of '+qOrder.length+' &mdash; click the right spot on the dashboard</small>'+SPOTS[qOrder[qi]].q;qbox.style.display='block'}
function answer(i){if(!quiz||qi>=qOrder.length)return;

 else{misses++;flash('Not quite - try again',true);if(misses>=2)document.getElementById('hit'+qOrder[qi]).classList.add('hint')}}
stage.addEventListener('click',function(e){if(quiz&&qi<qOrder.length&&!e.target.classList.contains('hit')){misses++;flash('Not quite - try again',true);if(misses>=2)document.getElementById('hit'+qOrder[qi]).classList.add('hint')}});
